version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    groups:
      nuxt-stack:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "@nuxtjs/*"
          - "vue"
          - "vue-*"
          - "@vue/*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier*"
          - "vitest"
          - "@vitest/*"
          - "@vue/test-utils"
          - "happy-dom"
          - "typescript"
          - "vue-tsc"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
      include: scope
