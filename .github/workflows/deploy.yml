name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://danilofernando.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline
        env:
          NPM_CONFIG_FUND: "false"

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_PUBLIC_SITE_URL: https://danilofernando.dev
          NUXT_PUBLIC_USE_HTTP_REPOSITORIES: "false"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@392082d4a59f6ea3d00a1ffd23e03fd8f1f1e356 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=danilofernando-dev --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
